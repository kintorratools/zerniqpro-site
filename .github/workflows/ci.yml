name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck and build
        run: pnpm build

      - name: Wrangler dry run
        run: pnpm worker:dry-run

      - name: CMS integration tests
        run: pnpm test:cms

      - name: CMS Probe Contract Tests
        run: pnpm test:cms-probe-contract

      - name: Product SSR tests
        run: pnpm test:product

      - name: Product Runtime v2 Check
        run: pnpm test:product-runtime-v2

      - name: Brand & i18n tests
        run: pnpm test:brand-i18n

      - name: Generic template scan
        run: pnpm test:generic

      - name: Global runtime tests
        run: pnpm test:global-runtime

      - name: Runtime hygiene tests
        run: pnpm test:runtime-hygiene

      - name: Page template map tests
        run: pnpm test:page-map

      - name: Homepage runtime tests
        run: pnpm test:homepage-runtime

      - name: Homepage media contract tests
        run: pnpm test:homepage-media

      - name: Homepage media render tests
        run: pnpm test:homepage-media-render

      - name: Support runtime tests
        run: pnpm test:support-runtime

      - name: Theme preservation tests
        run: pnpm test:theme-preservation

      - name: Smoke tests
        run: pnpm test:smoke
