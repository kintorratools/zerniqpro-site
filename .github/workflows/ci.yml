name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck and build
        run: pnpm build

      - name: Wrangler dry run
        run: pnpm worker:dry-run

      - name: CMS integration tests
        run: pnpm test:cms

      - name: Product SSR tests
        run: pnpm test:product

      - name: Brand & i18n tests
        run: pnpm test:brand-i18n

      - name: Generic template scan
        run: pnpm test:generic

      - name: Global runtime tests
        run: pnpm test:global-runtime

      - name: Theme preservation tests
        run: pnpm test:theme-preservation

      - name: Smoke tests
        run: pnpm test:smoke
